# Terminal buckets. Not businesses, not people — but valid classifier outputs.
system:
  UNASSIGNED:
    tree: "_UNASSIGNED"
    # Confidence below threshold, or genuinely ambiguous. Goes to review,
    # never silently filed into a real entity.
  JUNK:
    tree: "_JUNK"
    # Marketing and bulk mail. Filed, never deleted (hard rule: no deletes).

# Routing precedence, highest first. Deterministic code applies these before
# the model is consulted at all; the model only decides what code cannot.
routing:
  precedence:
    - recipient_email     # exact match on an entity's `emails`
    - sender_domain       # exact match on an entity's `domains`
    - alias_in_subject
    - alias_in_body
    - model               # only reached when every rule above misses
  min_confidence: 0.60    # below this → UNASSIGNED + quarantine + review
