# Entity registry — the single source of truth for routing.
#
# Every classification resolves to exactly one entity_id from this file.
# The classifier is given the ids and match hints below and nothing else;
# it never invents an entity.
#
# NOTE ON PLACEHOLDERS
# Values marked TODO(C16) are blocked on the client item C16 — legal names,
# EINs, and exact spellings from the formation documents. The system RUNS
# with placeholders (routing works off domains and aliases), but a document
# that needs a legal name or EIN will land in UNASSIGNED until they're filled.
# Anything still reading TODO(C16) at acceptance is a defect, not a stub.
#
# WHAT THE WEBSITES COULD AND COULD NOT SUPPLY (Sept 8)
# The four public sites were read to fill this file. They gave: trading names,
# confirmed email addresses, phone numbers, one street address, the people, and
# a set of real-world aliases better than anything guessed. Routing is now
# materially more accurate than it was.
#
# They did NOT give, and cannot give:
#   * Legal names. "MLE Consulting Agency" is what the marketing says. The
#     formation document may read "MLE Consulting Agency LLC", or something
#     else entirely. A trading name and a legal name agree until they don't,
#     and the moment they don't is a tax notice filed against the wrong entity.
#   * EINs. These are never published, by design.
#
# So C16 is NOT closed by this pass. It is narrowed to two fields per business,
# both of which live on the formation documents and nowhere else.
#
# NEVER put credentials in this file. Mailbox secrets live in the macOS
# Keychain; this file holds addresses only, for routing.

version: 1

people:
  P_MRE:
    name: "Matthew R. Epstein"
    tree: "PERSONAL/Matthew"
    aliases:
      - "Matthew Epstein"
      - "Matt Epstein"
      - "M. Epstein"
      - "Matthew R Epstein"
      - "Matthew R. Epstein"
    emails:
      - "mattyeps@gmail.com"

  P_JG:
    name: "Jessie Gwilt"
    role: fiancee
    tree: "PERSONAL/Jessie"
    # SPELLING CONFLICT, both variants kept deliberately.
    # mrecai.com spells her "Jessie"; the Aug 6 planning docs spelled her
    # "Jesse". Rather than pick one and lose the other, both match.
    #
    # DUAL ROLE — this is a real classification hazard, not a note.
    # She is Matthew's fiancee AND Chief Marketing Officer of MRECAI. Mail
    # mentioning her is therefore genuinely ambiguous between PERSONAL/Jessie
    # and BUSINESS/B_MRE, and the correct answer depends on content, not on
    # the name. The classifier must not route to her on a name match alone;
    # an mrecai.com recipient address outranks her name (routing.precedence).
    aliases:
      - "Jessie Gwilt"
      - "Jesse Gwilt"
      - "J. Gwilt"
      - "Jessie"
    emails: []          # TODO(C16) — likely has an mrecai.com address as CMO

