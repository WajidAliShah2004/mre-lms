# The coverage register — R7, addendum §4 and §6, D-069.
#
# "Maintain an explicit coverage register for each authorized personal and
#  business email account; iPhone and Mac texts or iMessage; Google Voice
#  messages, voicemail and available call transcripts; phone logs; WhatsApp or
#  other work chats; calendar invitations and notes; and any additional
#  communication app Matthew approves. For each source, document its supported
#  API, export, sync, share-sheet or capture method, permissions, last
#  successful checkpoint, failures and gaps."  (addendum §6)
#
# This file is the documented half. The other half — last successful
# checkpoint, failures, missed intervals — is measured, not written here: each
# reader records every pass in the `source_checks` table, and
# core/pipeline/coverage.py joins the two (./ops/coverage.py prints it).
#
# A source is listed whether or not it works. "Never report the day as fully
# reviewed unless every registered source completed or its gap is explicitly
# disclosed" (§6) only means something if the sources that do not work yet are
# on the list too.
#
# Fields
#   id             stable; readers record checks under it (email:<address>)
#   label          what the brief calls it
#   kind           email | messages | calls | chat | calendar | storage |
#                  capture | planning
#   account        the account or device it is read from, if one is known
#   method         how it is read: the API, export, sync or capture route
#   permissions    exactly what access is held, or would be needed
#   cadence_hours  how often it must be checked; null = pushed to us, or not
#                  read yet. The addendum asks hourly for active sources and
#                  every 3 h for the rest (§6); see each entry for where the
#                  schedule stands
#   status         active | pending | blocked | unsupported
#   requirement    REQUIREMENTS_REMAINING.md item
#   blocked_on     for anything not active: the decision or answer it waits on
#   gaps           what this source does NOT cover, even when it works

version: 1

sources:
