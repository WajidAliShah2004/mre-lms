    label: MRECAI mail
    kind: email
    account: matthew@mrecai.com
    method: Gmail API, read-only poll of a rolling window (ops/poll_mail.py)
    permissions: gmail.readonly via the MRECAI Workspace internal app (D-061)
    cadence_hours: 12
    status: active
    requirement: R16
    gaps: >-
      Calendar attachments (.ics) are not read, only the email around them
      (R6). Mail in Spam is read like any other; nothing is moved.

  - id: email:matthew@mleca.com
    label: MLECA mail
    kind: email
    account: matthew@mleca.com
    method: Gmail API, read-only poll of a rolling window (ops/poll_mail.py)
    permissions: gmail.readonly via the MLECA Workspace internal app (D-061)
    cadence_hours: 12
    status: active
    requirement: R16
    gaps: Calendar attachments (.ics) are not read (R6).

  - id: email:mre@atlase.ai
    label: Atlase mail (mre@)
    kind: email
    account: mre@atlase.ai
    method: Gmail API, read-only poll of a rolling window (ops/poll_mail.py)
    permissions: gmail.readonly via the Atlase Workspace internal app (D-061)
    cadence_hours: 12
    status: active
    requirement: R16
    gaps: Calendar attachments (.ics) are not read (R6).

  - id: email:mattyeps@gmail.com
    label: Personal Gmail
    kind: email
    account: mattyeps@gmail.com
    method: Gmail API, read-only poll of a rolling window (ops/poll_mail.py)
    permissions: gmail.readonly via the published External app (D-061)
    cadence_hours: 12
    status: active
    requirement: R16
    gaps: >-
      Some mail reaches it forwarded through iCloud (3 in 3 days on Oct 6);
      the forwarder is not identified. Calendar attachments are not read (R6).

  - id: email:mreconsultinginsurance@gmail.com
    label: Business Gmail (mreconsultinginsurance)
    kind: email
    account: mreconsultinginsurance@gmail.com
    method: Gmail API, read-only poll of a rolling window (ops/poll_mail.py)
    permissions: gmail.readonly via the published External app (D-061)
    cadence_hours: 12
    status: active
    requirement: R39
    gaps: >-
      Routed to B_MRE by recipient (entities.yaml); the classifier still files
      personal items (IONOS invoices) to PERSONAL. Calendar attachments (.ics)
