  # -------------------------------------------------------------------------
  # Texts and calls
  # -------------------------------------------------------------------------
  - id: messages:imessage
    label: iMessage
    kind: messages
    account: Matthew's Apple Account in Messages on the Mac (D-068, D-078)
    method: >-
      read-only copy of Messages' ~/Library/Messages/chat.db on the Mac
      (ops/imessage.py, D-081). One transcript per chat per day, filed when
      the day closes; documents and photos filed under it; voice messages
      transcribed on the Mac; names from a read-only copy of Contacts
    permissions: >-
      Full Disk Access for Homebrew's python3.12 and Python.app (already
      granted for WhatsApp); Messages on the Mac signed in to his account
      with Messages in iCloud on. Nothing is written to Messages and nothing
      is sent
    cadence_hours: 1
    status: active
    requirement: R2
    gaps: >-
      Only what this Mac's Messages holds; nothing while it is signed out.
      Videos are listed, not filed. Attachments not on the Mac are listed,
      not filed, and make the pass PARTIAL: with Messages in iCloud most
      older attachments stay in iCloud (666 of 13,858 on the Mac, Nov 15). A message deleted after filing stays filed. The hourly job
      reads the last 3 days; a message that reaches the Mac later is filed
      only by a backfill run. A pass with nothing newer than 48 hours is
      PARTIAL.

  - id: messages:sms
    label: Text messages (SMS and RCS)
    kind: messages
    account: his iPhone, forwarded to the Mac
    method: >-
      the same chat.db and the same reader as iMessage (D-081), once Text
      Message Forwarding is on; each iMessage pass records this line too
    permissions: Text Message Forwarding on the iPhone for this Mac
    cadence_hours: 1
    status: active
    requirement: R2
    gaps: >-
      SMS and RCS only while Text Message Forwarding is on: a pass where
      iMessage arrives and no SMS or RCS has for 7 days is PARTIAL.

  - id: calls:google-voice
    label: Google Voice, voicemail, call transcripts
    kind: calls
    method: >-
      none of its own. Matthew, Nov 15 (D-082): calls and voicemail come from
      Google Voice, Grasshopper and Epocra, and all of them email a business
      mailbox. Every business mailbox is already polled, so those emails are
      filed (archive, Nov 15: Grasshopper 77, mostly MRECAI; Epocra 40,
      mostly MLECA; Google Voice 5); whether they carry the transcript text
      or the audio is not yet checked.
    permissions: none beyond the mailboxes' gmail.readonly
    cadence_hours: null
    status: pending
    requirement: R3
    blocked_on: >-
      Epocra emails carry transcripts; Grasshopper and Google Voice send
      notices only, with no audio (D-082). Matthew: Grasshopper
      voicemail-to-email with audio or transcription, and Google Voice
      "Get voicemail via email".
    gaps: >-
      A call without a transcript proves contact occurred, not what was
      promised (§6). Nothing promised on a call is captured.

  - id: calls:phone-log
    label: iPhone call log
    kind: calls
    method: no supported read path from the Mac
    permissions: n/a
    cadence_hours: null
    status: unsupported
    requirement: R3
    blocked_on: "No route identified; listed so the gap stays visible."
    gaps: Who called and when is not known to the system.

  - id: chat:whatsapp
    label: WhatsApp
    kind: chat
    account: Matthew's WhatsApp, linked to the Mac app
    method: >-
      read-only copy of the WhatsApp Mac app's ChatStorage.sqlite
      (ops/whatsapp.py, D-079). One transcript per chat per day, filed when
      the day closes; documents and photos filed under it; voice notes
      transcribed on the Mac. Unofficial: a WhatsApp update can change it,
      and the pass then fails loudly
    permissions: >-
      Full Disk Access for Homebrew's python3.12 and Python.app (the programs
      the venv runs; ops/WHATSAPP_APPLY.md step 3); the WhatsApp Mac app
      linked to his phone. Nothing is written to WhatsApp and nothing is sent
    cadence_hours: 1
    status: active
    requirement: R40
    gaps: >-
      Only the history the Mac app synced when linked. Videos are listed, not
      filed. Files the Mac app never downloaded are listed, not filed. The
      history's media was never downloaded to the Mac (auto-download covers
      new media only), so the 30 days backfilled on Nov 7 list older files
      without filing them; Matthew can export those chats from his phone
      into the watch folder. A message
      deleted in WhatsApp after filing stays filed. Reads only while the Mac
      app runs and syncs (a pass with nothing newer than 48 hours is
      PARTIAL). The hourly job reads only messages sent in the last 3 days,
      so one that reaches the Mac later than that is filed only by a
      backfill run.

  # -------------------------------------------------------------------------
  # Calendar
  # -------------------------------------------------------------------------
  - id: calendar:invitations
    label: Calendar invitations and notes
    kind: calendar
    method: >-
      none directly. Invitations arrive as email and the email is filed; the
      .ics attachment is skipped
    permissions: would need calendar.readonly per Google account
    cadence_hours: 3
    status: pending
    requirement: R6
    blocked_on: Not built.
    gaps: Times, attendees and notes inside invitations are not read.

  # -------------------------------------------------------------------------
  # Storage — read-only sources (R5, R8)
  # -------------------------------------------------------------------------
  - id: storage:icloud-drive
    label: iCloud Drive
    kind: storage
    account: the Mac's iCloud, mattyeps@gmail.com (D-082)
    method: >-
      the iCloud Drive folder on the Mac and the Documents folders of Pages,
      Numbers, Keynote, Preview and TextEdit, listed without opening files
      (ops/drives.py, D-083); the LMS folder is skipped. Every file indexed;
      documents created or changed from the start date filed once unchanged
      for 24 hours
    permissions: Full Disk Access for the venv's Python (already granted); read only
    cadence_hours: 3
    status: active
    requirement: R5
    gaps: >-
      Documents older than the start date (Nov 15 2026) are filed only by a
      backfill (ops/backfill_drives.py). Files over 100 MB, videos, audio and
      other non-documents are indexed, not filed. A file dated in the future
      (one is dated 2086) never settles, so it is never filed.

  - id: storage:icloud-archive
    label: iCloud Drive, saved copies (Jul 30 and Oct 5)
    kind: storage
    account: the two folders macOS kept in ~/Library/CloudStorage when iCloud was signed out
    method: listed by ops/drives.py --source storage:icloud-archive, index only (D-083)
    permissions: Full Disk Access (already granted); read only
    status: active
    requirement: R5
    gaps: >-
      Indexed only, once (Nov 15: 244,756 files); nothing in them is filed.
      Run again by hand only if the copies change.

  - id: storage:gdrive:matthew@mrecai.com
    label: Google Drive (MRECAI)
    kind: storage
    account: matthew@mrecai.com (D-082)
    method: >-
      Drive API, read-only (ops/drives.py, D-083): every file in My Drive,
      shared drives and Shared with me indexed; documents from My Drive and
      shared drives filed once unchanged for 24 hours; Docs, Sheets and
      Slides filed as PDF
    permissions: drive.readonly via the MRECAI Workspace internal app, granted Nov 17
    cadence_hours: 3
    status: active
    requirement: R5
    gaps: >-
      Shared with me is indexed, not filed. Documents older than the start
      date (the day of the first pass, Nov 17 2026) are filed only by a
      backfill. Exports over Google's 10 MB limit and files over 100 MB are
      not filed. A full listing (first pass, or after Google expires the
      changes token) takes hours: 1,784,099 files across 59 shared drives.

  - id: storage:gdrive:matthew@mleca.com
    label: Google Drive (MLECA)
    kind: storage
    account: matthew@mleca.com (D-082)
    method: >-
      Drive API, read-only (ops/drives.py, D-083): every file in My Drive,
      shared drives and Shared with me indexed; documents from My Drive and
